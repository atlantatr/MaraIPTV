name: APK Derle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          # varsayilan 'tools' paketi artik yok -> sadece gerekenleri kur
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Logo setini uygula (branding/*.png)
        run: |
          if ls branding/*.png >/dev/null 2>&1; then
            pip install --quiet pillow
            python3 tools/brand.py
          else
            echo "branding/ klasorunde logo seti yok, varsayilan ikon kullanilacak"
          fi

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Debug APK'lar (4.2 / 5.0 / 7.0)
        run: gradle assembleDebug --stacktrace

      - name: Release APK'lar (kucuk/optimize)
        continue-on-error: true
        run: gradle assembleRelease --stacktrace

      - name: APK'lari yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MaraIPTV-apk
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/mapping/**/missing_rules.txt
          if-no-files-found: warn
