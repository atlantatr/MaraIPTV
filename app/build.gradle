plugins {
    id 'com.android.application'
}

// Media3 (Android 5.0+ surumleri) ve FFmpeg ses cozucu (AC3/EAC3/DTS/TrueHD)
def media3Version = '1.5.0'
def useFfmpeg = (project.findProperty('mara.ffmpeg') ?: 'true').toString().toBoolean()

// Her derlemede degisen surum: kullanici hangi yapinin kurulu oldugunu gorebilsin.
// versionCode = 2026-01-01'den bu yana gecen dakika (tek yonlu artar, < 2.1 milyar).
def buildStamp = new java.text.SimpleDateFormat("yyMMdd-HHmm").format(new java.util.Date())
def buildNo = (int) ((System.currentTimeMillis() - 1767225600000L) / 60000L)

android {
    namespace 'com.atlanta.maraplayer'
    compileSdk 35

    defaultConfig {
        applicationId "com.atlanta.maraplayer"
        targetSdk 28
        multiDexEnabled true
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86'
        }
    }

    buildFeatures {
        buildConfig true
    }

    // ---------------------------------------------------------------
    // 3 surum: legacy = Android 4.2+, lollipop = Android 5.0+, nougat = Android 7.0+
    //
    // LITE: Android 4.2 surumu hafif surumdur. Kayit (tum zamanli kayitlar,
    // kayit listesi, arka plan servisi, tek baglanti relay) ve spor rehberi /
    // mac hatirlatici bu surumde yoktur. BuildConfig.LITE derleme zamani sabiti
    // oldugu icin R8 bu dallari ve kullanilmayan siniflari APK'dan cikarir.
    // ---------------------------------------------------------------
    flavorDimensions 'api'
    productFlavors {
        legacy {
            dimension 'api'
            minSdk 17
            versionCode 5000000 + buildNo
            versionName "2.0.0-a43." + buildStamp
            buildConfigField 'boolean', 'ADVANCED', 'false'
            buildConfigField 'boolean', 'LITE', 'true'
            buildConfigField 'String', 'EDITION', '"Android 4.2+ (Lite)"'
        }
        lollipop {
            dimension 'api'
            minSdk 21
            versionCode 5000000 + buildNo
            versionName "2.0.0-a51." + buildStamp
            buildConfigField 'boolean', 'ADVANCED', 'true'
            buildConfigField 'boolean', 'LITE', 'false'
            buildConfigField 'String', 'EDITION', '"Android 5.0+"'
        }
        nougat {
            dimension 'api'
            minSdk 24
            versionCode 5000000 + buildNo
            versionName "2.0.0-a71." + buildStamp
            buildConfigField 'boolean', 'ADVANCED', 'true'
            buildConfigField 'boolean', 'LITE', 'false'
            buildConfigField 'String', 'EDITION', '"Android 7.0+"'
        }
    }

    sourceSets {
        // lollipop ve nougat ortak "modern" kodu (Media3, coklu ekran, Android TV ana ekran) paylasir
        lollipop {
            java.srcDirs += 'src/modern/java'
            res.srcDirs += 'src/modern/res'
        }
        nougat {
            java.srcDirs += 'src/modern/java'
            res.srcDirs += 'src/modern/res'
        }
    }

    // Imza: guncellemelerin mevcut kurulumlarin uzerine sorunsuz kurulabilmesi icin
    // (ayni sertifika) keystore yolu SABIT tutulur. Bazi ortamlarda user.home gecici
    // bir dizine yonlendirilebiliyor; bu durumda Gradle yeni bir debug anahtari
    // uretiyor ve "INSTALL_FAILED_INCONSISTENT_CERTIFICATES" hatasi cikiyor.
    def stableDebugKeystore = new File(
            System.getenv('USERPROFILE') ?: System.getProperty('user.home'),
            '.android/debug.keystore')
    signingConfigs {
        if (stableDebugKeystore.exists()) {
            debug {
                storeFile stableDebugKeystore
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Kendi imza anahtariniz yoksa debug anahtariyla imzalanir (sideload icin yeterli)
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'META-INF/DEPENDENCIES']
        }
    }
}

// Sadece legacy (Android 4.2) surumunde API 17 uyumlu kutuphane surumlerine sabitle
configurations.configureEach { conf ->
    if (conf.name.toLowerCase().startsWith('legacy')) {
        conf.resolutionStrategy {
            force 'com.google.guava:guava:31.1-android'
            eachDependency { details ->
                // androidx.core 1.12+ minSdk 19 ister
                if (details.requested.group == 'androidx.core' && details.requested.name == 'core') {
                    details.useVersion '1.9.0'
                }
            }
        }
    }
}

dependencies {
    // Ortak
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
    implementation 'androidx.multidex:multidex:2.0.1'

    // Android 4.2: ExoPlayer 2.19.1 (minSdk 16 destekleyen son seri)
    legacyImplementation 'com.google.android.exoplayer:exoplayer-core:2.19.1'
    legacyImplementation 'com.google.android.exoplayer:exoplayer-hls:2.19.1'

    // Android 5.0+ / 7.0+: AndroidX Media3
    for (String f : ['lollipop', 'nougat']) {
        add("${f}Implementation", "androidx.media3:media3-exoplayer:$media3Version")
        add("${f}Implementation", "androidx.media3:media3-exoplayer-hls:$media3Version")
        add("${f}Implementation", "androidx.media3:media3-exoplayer-dash:$media3Version")
        add("${f}Implementation", "androidx.media3:media3-ui:$media3Version")
        add("${f}Implementation", 'androidx.tvprovider:tvprovider:1.0.0')
        add("${f}Implementation", 'androidx.annotation:annotation-experimental:1.4.1') // @OptIn
        if (useFfmpeg) {
            // Jellyfin'in hazir FFmpeg eklentisi (AC3, EAC3, DTS, TrueHD, MP2...)
            // Not: versiyon "+1" build sayisi icerir; Groovy'da dogru yazilmazsa
            // string concatenation ("1.5.01") olur ve dependency cözümlenemez.
            def ffmpegVer = media3Version + '+1'
            add("${f}Implementation", "org.jellyfin.media3:media3-ffmpeg-decoder:${ffmpegVer}")
        }
    }
}
